name: Aloovoice APK
on:
  push:
    paths: ['Aloo/**', '.github/workflows/aloovoice-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aloo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aloovoice-debug-apk
          path: Aloo/app/build/outputs/apk/debug/app-debug.apk
